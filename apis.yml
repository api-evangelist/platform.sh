apis:
- aid: platform.sh-rest-api
  name: Platform.sh REST API
  description: 'The public REST API for the Platform.sh / Upsun cloud application platform: 263 operations over
    187 paths covering projects, environments, deployments, backups and restores, domains, TLS certificates, routes,
    variables, activities, source operations, SSH keys, API tokens, organizations, teams, members, invitations,
    subscriptions, orders, invoices, discounts and usage alerts. OAuth 2.0 authorization-code and client-credentials
    flows, HAL `_links` hypermedia, cursor pagination via page[before]/page[after]/page[size], and RFC 9457 application/problem+json
    error bodies.'
  humanURL: https://developer.upsun.com/api
