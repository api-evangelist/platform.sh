aid: platform.sh
name: Platform.sh
description: 'Platform.sh is the container-based Platform-as-a-Service (PaaS) founded in 2010 and headquartered
  in Paris and San Francisco, best known for Git-driven deployments in which a single push plus a few YAML files
  provisions an entire cluster of applications and managed services (PostgreSQL, MySQL, Redis, RabbitMQ, OpenSearch
  and more) together with byte-for-byte preview environments cloned from production. The company rebranded to Upsun:
  platform.sh now redirects to upsun.com, the original Platform.sh product is documented as ''Upsun Fixed'' at docs.upsun.com,
  and the public REST API - whose own OpenAPI description reads ''Upsun, formerly Platform.sh'' - is still authenticated
  by the OAuth 2.0 authorization server at auth.api.platform.sh with regional gateways on platform.sh hosts. That
  API exposes 263 operations across projects, environments, backups, domains, certificates, variables, activities,
  organizations, teams, subscriptions and billing, returns RFC 9457 application/problem+json errors, and is accompanied
  by a first-party CLI, PHP/JavaScript API clients and language config readers published under the platformsh namespace.'
image: https://upsun.com/default_social.png
url: https://raw.githubusercontent.com/api-evangelist/platform.sh/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
x-successor-brand: upsun
x-successor-note: Platform.sh rebranded to Upsun. platform.sh 301s to upsun.com, docs.platform.sh 301s to fixed.docs.upsun.com
  ('Upsun Fixed'), and api.platform.sh 301s to developer.upsun.com/api. The API Evangelist network also carries
  all/upsun for the successor brand; this profile and that one describe the same company and the same REST API and
  should be reconciled by the network de-duplication pass.
