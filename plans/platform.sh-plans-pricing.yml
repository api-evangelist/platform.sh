  API itself is not separately metered or priced; access is included with a project.'
pricing_dimensions:
- dimension: Project fees
  detail: A consistent monthly cost per project covering orchestration and provisioning, with baseline features
    and limits such as infrastructure metrics and a build-minute allowance.
- dimension: Project resources
  detail: CPU, memory and disk (including backup disk) metered across organization, project and environment for
    the billing period. Preview environments carry no creation fee, only the resources they use.
- dimension: User licenses
  detail: A per-user license fee per organization user. Viewers, and Viewers who manage billing, are not charged.
    No cap on user count.
- dimension: Feature add-ons
  detail: Optional organization-level add-ons billed separately.
