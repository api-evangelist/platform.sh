openapi: 3.2.0
info:
  title: Platform.sh Continuous Profiling API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Continuous Profiling across 2 of this provider''s published API definitions: platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
security:
- BearerAuth: []
tags:
- name: Continuous Profiling
paths:
  /projects/{projectId}/environments/{envId}/continuous-profiling:
    get:
      operationId: list_applications
      summary: List profiled applications
      description: Returns all applications reporting continuous profiling data for the authenticated agent, scoped to the given time range. Each application includes its available profile types (with unit and aggregation metadata) and detected languages
      tags:
      - Continuous Profiling
      parameters:
      - name: projectId
        in: path
        required: true
        description: The unique identifier of the Upsun project
        schema:
          type: string
          pattern: '[a-z0-9]+'
          example: 22sdxmbrs4lai
      - name: envId
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
          pattern: .+
          example: main
      - name: from
        in: query
        description: Start of the time range as a Unix timestamp, defaults to now minus 30 minutes.
        schema:
          type: integer
          format: int64
          example: 1700000000
      - name: to
        in: query
        description: End of the time range as a Unix timestamp, defaults to now.
        schema:
          type: integer
          format: int64
          example: 1700003600
      responses:
        '200':
          description: Applications listed successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - applications
                properties:
                  applications:
                    type: object
                    description: Map of application name to application details
                    example:
                      ingester:
                        name: ingester
                        profile_types:
                          cpu:
                            name: cpu
                            description: Time spent running on the CPU
                            title: CPU Time
                            unit: nanoseconds
                            aggregation: sum
                          alloc_objects:
                            name: alloc_objects
                            description: Number of objects allocated
                            title: Allocations
                            unit: count
                            aggregation: sum
                        languages:
                        - go
                      admin-pipeline:
                        name: admin-pipeline
                        profile_types:
                          cpu:
                            name: cpu
                            description: Time spent running on the CPU
                            title: CPU Time
                            unit: nanoseconds
                            aggregation: sum
                          wall-time:
                            name: wall-time
                            description: Wall clock time spent executing
                            title: Wall Time
                            unit: nanoseconds
                            aggregation: sum
                        languages:
                        - php
                    additionalProperties:
                      type: object
                      additionalProperties: false
                      required:
                      - name
                      - profile_types
                      - languages
                      properties:
                        name:
                          type: string
                          example: my-app
                        profile_types:
                          type: object
                          description: Map of profile type name to profile type details
                          example:
                            cpu:
                              name: cpu
                              description: Time spent running on the CPU
                              title: CPU Time
                              unit: nanoseconds
                              aggregation: sum
                            alloc_objects:
                              name: alloc_objects
                              description: Number of objects allocated
                              title: Allocations
                              unit: count
                              aggregation: sum
                          additionalProperties:
                            type: object
                            additionalProperties: false
                            required:
                            - name
                            - description
                            - title
                            - unit
                            - aggregation
                            properties:
                              name:
                                type: string
                                example: cpu
                              description:
                                type: string
                                example: Time spent running on the CPU
                              title:
                                type: string
                                example: CPU Time
                              unit:
                                type: string
                                example: nanoseconds
                              aggregation:
                                type: string
                                enum:
                                - avg
                                - sum
                                example: sum
                        languages:
                          type: array
                          items:
                            type: string
                          example:
                          - go
                          - python
        '400':
          description: Bad request - Invalid parameters. Please consult the API documentation to fix the request parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: invalid 'from' parameter
        '403':
          description: Forbidden - Access denied due to insufficient permissions, or the requested project/environment does not exist (to prevent information disclosure)
        '499':
          description: Query timeout - The query exceeded the server timeout limit. Please narrow down the query by reducing the time range or adding more specific filters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    example: 499
                  message:
                    type: string
                    example: Timeout while querying data
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /projects/{projectId}/environments/{envId}/continuous-profiling/app/{app}:
    get:
      operationId: get_application_timeline
      summary: Get application timeline
      description: Returns timeline data points for the given application and profile type, scoped to the authenticated agent. Points are aggregated at a computed grain (60s to 1h) based on the time range. The response includes the bounded time range, aggregation metadata, and the agent retention period
      tags:
      - Continuous Profiling
      parameters:
      - name: projectId
        in: path
        required: true
        description: The unique identifier of the Upsun project
        schema:
          type: string
          pattern: '[a-z0-9]+'
          example: 22sdxmbrs4lai
      - name: envId
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
          pattern: .+
          example: main
      - name: app
        in: path
        required: true
        description: URL-encoded application name
        schema:
          type: string
          pattern: .+
          example: my-app
      - name: from
        in: query
        description: Start of the time range as a Unix timestamp, defaults to now minus 30 minutes.
        schema:
          type: integer
          format: int64
          example: 1700000000
      - name: to
        in: query
        description: End of the time range as a Unix timestamp, defaults to now.
        schema:
          type: integer
          format: int64
          example: 1700003600
      - name: profile_type
        in: query
        description: Profile type to query.
        schema:
          type: string
          enum:
          - cpu
          - wall-time
          - wall
          - goroutine
          - alloc_objects
          - alloc_space
          - inuse_objects
          - inuse_space
          - space
          default: null
          example: cpu
      - $ref: '#/components/parameters/RuntimeMode'
      - $ref: '#/components/parameters/RuntimeValues'
      - $ref: '#/components/parameters/RuntimeVersionMode'
      - $ref: '#/components/parameters/RuntimeVersionValues'
      - $ref: '#/components/parameters/RuntimeArchMode'
      - $ref: '#/components/parameters/RuntimeArchValues'
      - $ref: '#/components/parameters/RuntimeOsMode'
      - $ref: '#/components/parameters/RuntimeOsValues'
      - $ref: '#/components/parameters/ProbeVersionMode'
      - $ref: '#/components/parameters/ProbeVersionValues'
      responses:
        '200':
          description: Timeline data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - from
                - to
                - grain
                - unit
                - aggregation_type
                - retention
                - points
                properties:
                  from:
                    type: integer
                    format: int64
                    description: Actual start of the time range as a Unix timestamp
                    example: 1700000000
                  to:
                    type: integer
                    format: int64
                    description: Actual end of the time range as a Unix timestamp
                    example: 1700003600
                  grain:
                    type: integer
                    description: Granularity of data points in seconds
                    example: 1800
                  unit:
                    type: string
                    description: Unit of the sample values, suffixed with `_per_second` for sum aggregation types
                    example: nanoseconds_per_second
                  aggregation_type:
                    type: string
                    enum:
                    - avg
                    - sum
                    example: sum
                  retention:
                    type: integer
                    description: Agent retention period in minutes
                    example: 80640
                  points:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - timestamp
                      properties:
                        timestamp:
                          type: integer
                          format: int64
                          example: 1700000000
                        value:
                          type: integer
                          format: int64
                          description: Aggregated sample value for this time slot. When no profiling data was collected during this slot, the key is entirely absent from the JSON object (not present as null or zero). The frontend should render such points as gaps in the timeline chart, not as zero-value data points
                          example: 15733333
        '400':
          description: Bad request - Invalid parameters. Please consult the API documentation to fix the request parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid filters
        '403':
          description: Forbidden - Access denied due to insufficient permissions, or the requested project/environment does not exist (to prevent information disclosure)
        '499':
          description: Query timeout - The query exceeded the server timeout limit. Please narrow down the query by reducing the time range or adding more specific filters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    example: 499
                  message:
                    type: string
                    example: Timeout while querying data
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /projects/{projectId}/environments/{envId}/continuous-profiling/app/{app}/merge:
    get:
      operationId: get_application_merge
      summary: Get merged profile
      description: 'Returns a merged profile for the given application over the specified time range. The output format is controlled by the `out` query parameter: `pprof` returns a gzipped protobuf with Content-Disposition header, `dot` returns a GraphViz DOT graph, `flamebearerv2` returns JSON flame graph data'
      tags:
      - Continuous Profiling
      parameters:
      - name: projectId
        in: path
        required: true
        description: The unique identifier of the Upsun project
        schema:
          type: string
          pattern: '[a-z0-9]+'
          example: 22sdxmbrs4lai
      - name: envId
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
          pattern: .+
          example: main
      - name: app
        in: path
        required: true
        description: URL-encoded application name
        schema:
          type: string
          pattern: .+
          example: my-app
      - name: from
        in: query
        description: Start of the time range as a Unix timestamp, defaults to now minus 30 minutes.
        schema:
          type: integer
          format: int64
          example: 1700000000
      - name: to
        in: query
        description: End of the time range as a Unix timestamp, defaults to now.
        schema:
          type: integer
          format: int64
          example: 1700003600
      - name: profile_type
        in: query
        description: Profile type to query.
        schema:
          type: string
          enum:
          - cpu
          - wall-time
          - wall
          - goroutine
          - alloc_objects
          - alloc_space
          - inuse_objects
          - inuse_space
          - space
          default: null
          example: cpu
      - name: out
        in: query
        description: Output format for the merged profile.
        schema:
          type: string
          enum:
          - pprof
          - dot
          - flamebearerv2
          default: null
          example: pprof
      - $ref: '#/components/parameters/RuntimeMode'
      - $ref: '#/components/parameters/RuntimeValues'
      - $ref: '#/components/parameters/RuntimeVersionMode'
      - $ref: '#/components/parameters/RuntimeVersionValues'
      - $ref: '#/components/parameters/RuntimeArchMode'
      - $ref: '#/components/parameters/RuntimeArchValues'
      - $ref: '#/components/parameters/RuntimeOsMode'
      - $ref: '#/components/parameters/RuntimeOsValues'
      - $ref: '#/components/parameters/ProbeVersionMode'
      - $ref: '#/components/parameters/ProbeVersionValues'
      responses:
        '200':
          description: Merged profile retrieved successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Gzipped pprof protobuf when `out=pprof`
            text/vnd.graphviz:
              schema:
                type: string
                description: GraphViz DOT graph when `out=dot`
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: Flame graph JSON when `out=flamebearerv2`
                required:
                - version
                - flamebearer
                - metadata
                - _profile_type
                - _sample_unit
                properties:
                  version:
                    type: integer
                    description: Flamebearer format version
                    example: 1
                  flamebearer:
                    type: object
                    additionalProperties: false
                    description: Core flame graph data structure containing function names and the hierarchical call tree encoded as levels of 4-tuples
                    required:
                    - names
                    - levels
                    - numTicks
                    - maxSelf
                    properties:
                      names:
                        type: array
                        description: Array of function identifiers referenced by index in `levels`. Each entry is a JSON-encoded location object with `filename`, `name`, and `line` fields
                        items:
                          type: string
                          example: sync/atomic.(*Pointer).Store
                        example:
                        - total
                        - time.now
                        - sync/atomic.(*Pointer).Store
                      levels:
                        type: array
                        description: Flame graph call tree encoded as levels. Each level is a flat array of 4-tuples `[offset, total, self, name_index]` where `offset` is the gap from the left edge in sample units, `total` is the inclusive sample count, `self` is the exclusive sample count, and `name_index` references the `names` array
                        items:
                          type: array
                          example:
                          - 0
                          - 7361350000000
                          - 5310000000
                          - 0
                          items:
                            type: integer
                            example: 0
                        example:
                        - - 0
                          - 7361350000000
                          - 5310000000
                          - 0
                        - - 5310000000
                          - 160000000
                          - 0
                          - 1
                          - 0
                          - 483950000000
                          - 0
                          - 2
                      numTicks:
                        type: integer
                        description: Total number of samples across the entire profile
                        example: 7361350000000
                      maxSelf:
                        type: integer
                        description: Maximum exclusive (self) sample count across all nodes
                        example: 333800000000
                  metadata:
                    type: object
                    additionalProperties: false
                    description: Profile metadata describing the format and sampling configuration
                    required:
                    - format
                    - spyName
                    - sampleRate
                    - units
                    - name
                    properties:
                      format:
                        type: string
                        description: Profile format. Always `single` for merged profiles (`double` is used for diff profiles)
                        example: single
                      spyName:
                        type: string
                        description: Name of the profiling agent that collected the data. Always `unknown` for pprof-based profiles
                        example: unknown
                      sampleRate:
                        type: integer
                        description: Sampling rate in Hz used during profiling
                        example: 100
                      units:
                        type: string
                        description: Unit of measure for sample values (e.g. `nanoseconds`, `bytes`, `count`)
                        example: nanoseconds
                      name:
                        type: string
                        description: Human-readable name for the profile
                        example: merged_profile
                  timeline:
                    type:
                    - object
                    - 'null'
                    description: Present for pyroscope flamebearer format compatibility. Always null for merged profiles returned by this endpoint — do not build UI to render this field
                    additionalProperties: false
                    required:
                    - startTime
                    - samples
                    - durationDelta
                    properties:
                      startTime:
                        type: integer
                        format: int64
                        description: Start of the timeline as a Unix timestamp in seconds
                        example: 1700000000
                      samples:
                        type: array
                        description: Sequence of sample counts, one per time bucket starting at `startTime` and spaced by `durationDelta`
                        items:
                          type: integer
                          example: 100
                        example:
                        - 100
                        - 200
                        - 150
                      durationDelta:
                        type: integer
                        format: int64
                        description: Time interval between consecutive samples in seconds
                        example: 10
                      watermarks:
                        type: object
                        description: Map of sample index to watermark timestamp
                        additionalProperties:
                          type: integer
                          format: int64
                    example: null
                  groups:
                    type: object
                    description: Present for pyroscope flamebearer format compatibility. Always an empty object for merged profiles returned by this endpoint — do not build UI to render this field
                    additionalProperties:
                      type: object
                      additionalProperties: false
                      required:
                      - startTime
                      - samples
                      - durationDelta
                      properties:
                        startTime:
                          type: integer
                          format: int64
                          description: Start of the timeline as a Unix timestamp in seconds
                          example: 1700000000
                        samples:
                          type: array
                          description: Sequence of sample counts, one per time bucket starting at `startTime` and spaced by `durationDelta`
                          items:
                            type: integer
                            example: 100
                          example:
                          - 100
                          - 200
                          - 150
                        durationDelta:
                          type: integer
                          format: int64
                          description: Time interval between consecutive samples in seconds
                          example: 10
                        watermarks:
                          type: object
                          description: Map of sample index to watermark timestamp
                          additionalProperties:
                            type: integer
                            format: int64
                    example: {}
                  heatmap:
                    type:
                    - object
                    - 'null'
                    description: Present for pyroscope flamebearer format compatibility. Always null for merged profiles returned by this endpoint — do not build UI to render this field
                    additionalProperties: false
                    required:
                    - values
                    - timeBuckets
                    - valueBuckets
                    - startTime
                    - endTime
                    - minValue
                    - maxValue
                    - minDepth
                    - maxDepth
                    properties:
                      values:
                        type: array
                        description: 2D matrix of occurrence counts indexed as `values[time_bucket][value_bucket]`
                        items:
                          type: array
                          example:
                          - 0
                          - 1
                          - 3
                          - 0
                          items:
                            type: integer
                            example: 0
                      timeBuckets:
                        type: integer
                        format: int64
                        description: Number of bins on the time (X) axis
                        example: 10
                      valueBuckets:
                        type: integer
                        format: int64
                        description: Number of bins on the value (Y) axis
                        example: 20
                      startTime:
                        type: integer
                        format: int64
                        description: Start of the time axis as Unix nanoseconds
                        example: 1700000000000000000
                      endTime:
                        type: integer
                        format: int64
                        description: End of the time axis as Unix nanoseconds
                        example: 1700003600000000000
                      minValue:
                        type: integer
                        description: Minimum value axis boundary
                        example: 0
                      maxValue:
                        type: integer
                        description: Maximum value axis boundary
                        example: 1000000
                      minDepth:
                        type: integer
                        description: Minimum non-zero count in the values matrix
                        example: 1
                      maxDepth:
                        type: integer
                        description: Maximum count in the values matrix
                        example: 500
                    example: null
                  _profile_type:
                    type: string
                    description: Profile type name
                    example: cpu
                  _sample_unit:
                    type: string
                    description: Unit of the sample values
                    example: nanoseconds
                  _aggregation_type:
                    type: string
                    description: Aggregation method for timeline data
                    enum:
                    - avg
                    - sum
                    example: sum
                  _application:
                    type: string
                    description: Application name the profile was collected from
                    example: ingester
                  _from:
                    type: string
                    format: date-time
                    description: Start of the merged time range
                    example: '2026-03-25T15:18:53Z'
                  _to:
                    type: string
                    format: date-time
                    description: End of the merged time range
                    example: '2026-04-01T14:18:53Z'
                  _scale_factor:
                    type: integer
                    description: Scale factor applied to sample values
                    example: 1
        '400':
          description: Bad request - Invalid parameters. Please consult the API documentation to fix the request parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: invalid 'profile_type' parameter (invalid)
        '403':
          description: Forbidden - Access denied due to insufficient permissions, or the requested project/environment does not exist (to prevent information disclosure)
        '499':
          description: Query timeout - The query exceeded the server timeout limit. Please narrow down the query by reducing the time range or adding more specific filters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    example: 499
                  message:
                    type: string
                    example: Timeout while querying data
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /projects/{projectId}/environments/{envId}/continuous-profiling/app/{app}/filter:
    get:
      operationId: get_application_filter
      summary: Get application filter values
      description: Returns available label filter fields and their distinct values for the given application. Use these values to build filter parameters (`runtime[]`, `runtime_version[]`, etc.) on the timeline and merge endpoints
      tags:
      - Continuous Profiling
      parameters:
      - name: projectId
        in: path
        required: true
        description: The unique identifier of the Upsun project
        schema:
          type: string
          pattern: '[a-z0-9]+'
          example: 22sdxmbrs4lai
      - name: envId
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
          pattern: .+
          example: main
      - name: app
        in: path
        required: true
        description: URL-encoded application name
        schema:
          type: string
          pattern: .+
          example: my-app
      - name: from
        in: query
        description: Start of the time range as a Unix timestamp, defaults to now minus 30 minutes.
        schema:
          type: integer
          format: int64
          example: 1700000000
      - name: to
        in: query
        description: End of the time range as a Unix timestamp, defaults to now.
        schema:
          type: integer
          format: int64
          example: 1700003600
      - name: profile_type
        in: query
        description: Profile type to query.
        schema:
          type: string
          enum:
          - cpu
          - wall-time
          - wall
          - goroutine
          - alloc_objects
          - alloc_space
          - inuse_objects
          - inuse_space
          - space
          default: null
          example: cpu
      - $ref: '#/components/parameters/RuntimeMode'
      - $ref: '#/components/parameters/RuntimeValues'
      - $ref: '#/components/parameters/RuntimeVersionMode'
      - $ref: '#/components/parameters/RuntimeVersionValues'
      - $ref: '#/components/parameters/RuntimeArchMode'
      - $ref: '#/components/parameters/RuntimeArchValues'
      - $ref: '#/components/parameters/RuntimeOsMode'
      - $ref: '#/components/parameters/RuntimeOsValues'
      - $ref: '#/components/parameters/ProbeVersionMode'
      - $ref: '#/components/parameters/ProbeVersionValues'
      responses:
        '200':
          description: Filter values retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - fields
                - max_applicable_filters
                properties:
                  fields:
                    type: object
                    description: Map of filter field name to its distinct values and counts
                    example:
                      runtime:
                        distinct_values: 2
                        values:
                        - value: go
                          count: 1500
                        - value: python
                          count: 500
                      runtime_version:
                        distinct_values: 3
                        values:
                        - value: '1.21'
                          count: 1000
                        - value: '1.22'
                          count: 400
                        - value: '3.12'
                          count: 600
                    additionalProperties:
                      type: object
                      additionalProperties: false
                      required:
                      - distinct_values
                      - values
                      properties:
                        distinct_values:
                          type: integer
                          description: Total number of distinct values for this field
                          example: 2
                        values:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - value
                            - count
                            properties:
                              value:
                                type: string
                                example: go
                              count:
                                type: integer
                                example: 1000
                  max_applicable_filters:
                    type: integer
                    description: Maximum number of applicable filters
                    example: 45
        '400':
          description: Bad request - Invalid parameters. Please consult the API documentation to fix the request parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid filters
        '403':
          description: Forbidden - Access denied due to insufficient permissions, or the requested project/environment does not exist (to prevent information disclosure)
        '499':
          description: Query timeout - The query exceeded the server timeout limit. Please narrow down the query by reducing the time range or adding more specific filters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
