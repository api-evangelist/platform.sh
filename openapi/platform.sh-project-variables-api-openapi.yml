openapi: 3.2.0
info:
  title: Platform.sh Project Variables API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Project Variables across 3 of this provider''s published API definitions: platform.sh-developer-portal-openapi-original.json, platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
tags:
- name: Project Variables
  description: 'These endpoints manipulate user-defined variables which are bound to an

    entire project. These variables are accessible to all environments

    within a single project, and they can be made available at both build

    time and runtime. For more information on project variables,

    see the [Variables](https://docs.upsun.com/anchors/variables/set/project/create/)

    section of the documentation.

    '
paths:
  /projects/{projectId}/variables:
    get:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      operationId: list-projects-variables
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectVariableCollection'
      tags:
      - Project Variables
      summary: Get list of project variables
      description: 'Retrieve a list of objects representing the user-defined variables

        within a project.

        '
      security:
      - OAuth2: []
    post:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      operationId: create-projects-variables
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectVariableCreateInput'
      tags:
      - Project Variables
      summary: Add a project variable
      description: 'Add a variable to a project. The `value` can be either a string or a JSON

        object (default: string), as specified by the `is_json` boolean flag.

        See the [Variables](https://docs.upsun.com/anchors/variables/set/project/create/)

        section in our documentation for more information.

        '
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /projects/{projectId}/variables/{projectVariableId}:
    get:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      - in: path
        required: true
        schema:
          type: string
        name: projectVariableId
      operationId: get-projects-variables
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectVariable'
      tags:
      - Project Variables
      summary: Get a project variable
      description: Retrieve a single user-defined project variable.
      security:
      - OAuth2: []
    patch:
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectVariablePatch'
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      - in: path
        required: true
        schema:
          type: string
        name: projectVariableId
      operationId: update-projects-variables
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
      tags:
      - Project Variables
      summary: Update a project variable
      description: 'Update a single user-defined project variable.

        The `value` can be either a string or a JSON

        object (default: string), as specified by the `is_json` boolean flag.

        See the [Variables](https://docs.upsun.com/anchors/variables/set/project/create/)

        section in our documentation for more information.

        '
      security:
      - OAuth2: []
    delete:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      - in: path
        required: true
        schema:
          type: string
        name: projectVariableId
      operationId: delete-projects-variables
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
      tags:
      - Project Variables
      summary: Delete a project variable
      description: Delete a single user-defined project variable.
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
