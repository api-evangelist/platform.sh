components:
  parameters:
    UserID:
      name: user_id
      in: path
      required: true
      description: The ID of the user.
      schema:
        type: string
        example: d81c8ee2-44b3-429f-b944-a33ad7437690
        format: uuid
    ProjectID:
      name: project_id
      in: path
      required: true
      description: The ID of the project.
      schema:
        type: string
    PageAfter:
      in: query
      name: page[after]
      description: Pagination cursor. This is automatically generated as necessary and provided in HAL links (_links); it should not be constructed externally.
      schema:
        type: string
    PageBefore:
      in: query
      name: page[before]
      description: Pagination cursor. This is automatically generated as necessary and provided in HAL links (_links); it should not be constructed externally.
      schema:
        type: string
    PageSizeAccess:
      in: query
      name: page[size]
      description: Determines the number of items to show.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: null
  schemas:
    ListLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/Link'
        previous:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
    UserProjectAccess:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: The ID of the user.
        organization_id:
          type: string
          format: ulid
          description: The ID of the organization.
        project_id:
          type: string
          description: The ID of the project.
        project_title:
          type: string
          description: The title of the project.
        permissions:
          $ref: '#/components/schemas/ProjectPermissions'
        granted_at:
          type: string
          format: date-time
          description: The date and time when the access was granted.
        updated_at:
          type: string
          format: date-time
          description: The date and time when the access was last updated.
        _links:
          type: object
          properties:
            self:
              type: object
              description: Link to the current access item.
              properties:
                href:
                  type: string
                  description: URL of the link.
            update:
              type: object
              description: Link for updating the current access item.
              properties:
                href:
                  type: string
                  description: URL of the link.
                method:
                  type: string
                  description: The HTTP method to use.
            delete:
              type: object
              description: Link for deleting the current access item.
              properties:
                href:
                  type: string
                  description: URL of the link.
                method:
                  type: string
                  description: The HTTP method to use.
    ProjectPermissions:
      type: array
      description: An array of project permissions.
      items:
        type: string
        enum:
        - admin
        - viewer
        - development:admin
        - development:contributor
        - development:viewer
        - staging:admin
        - staging:contributor
        - staging:viewer
        - production:admin
        - production:contributor
        - production:viewer
    Link:
      type: object
      title: Link
      description: A hypermedia link to the {current, next, previous} set of items.
      properties:
        href:
          type: string
          description: URL of the link
    Error:
      description: ''
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        code:
          type: number
        detail:
          type: object
        title:
          type: string
      title: ''
      x-examples:
        example-1:
          status: Invalid input
          message: This field is required.
          code: 400
          detail:
            field:
            - This field is required.
          title: Bad Request
