openapi: 3.2.0
info:
  title: Platform.sh Connections API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Connections across 3 of this provider''s published API definitions: platform.sh-developer-portal-openapi-original.json, platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
tags:
- name: Connections
paths:
  /users/{user_id}/connections:
    parameters:
    - $ref: '#/components/parameters/UserID'
    get:
      summary: List federated login connections
      description: Retrieves a list of connections associated with a single user.
      operationId: list-login-connections
      tags:
      - Connections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /users/{user_id}/connections/{provider}:
    parameters:
    - schema:
        type: string
      name: provider
      in: path
      required: true
      description: The name of the federation provider.
    - $ref: '#/components/parameters/UserID'
    get:
      summary: Get a federated login connection
      description: Retrieves the specified connection.
      operationId: get-login-connection
      tags:
      - Connections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
      security:
      - OAuth2: []
    delete:
      summary: Delete a federated login connection
      description: Deletes the specified connection.
      operationId: delete-login-connection
      tags:
      - Connections
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  parameters:
    UserID:
      name: user_id
      in: path
      required: true
      description: The ID of the user.
      schema:
        type: string
        example: d81c8ee2-44b3-429f-b944-a33ad7437690
        format: uuid
  schemas:
    Error:
      description: ''
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        code:
          type: number
        detail:
          type: object
        title:
          type: string
      title: ''
      x-examples:
        example-1:
          status: Invalid input
          message: This field is required.
          code: 400
          detail:
            field:
            - This field is required.
          title: Bad Request
    Connection:
      description: ''
      type: object
      properties:
        provider:
          type: string
          description: The name of the federation provider.
        provider_type:
          type: string
          description: The type of the federation provider.
        is_mandatory:
          type: boolean
          description: Whether the federated login connection is mandatory.
        subject:
          type: string
          description: The identity on the federation provider.
        email_address:
          type: string
          description: The email address presented on the federated login connection.
        created_at:
          type: string
          format: date-time
          description: The date and time when the connection was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time when the connection was last updated.
      x-examples:
        example-1:
          created_at: '2021-05-24T07:20:35.683264Z'
          provider: acme-inc-oidc
          provider_type: okta
          subject: '1621840835647277693'
          email_address: name@example.com
          updated_at: '2021-05-24T07:20:35.683264Z'
    Error_2:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
    Error_3:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          tokenUrl: https://auth.api.platform.sh/oauth2/token
          refreshUrl: https://auth.api.platform.sh/oauth2/token
          scopes: {}
          authorizationUrl: https://auth.api.platform.sh/oauth2/authorize
      description: ''
    OAuth2Admin:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.api.platform.sh/oauth2/token
          refreshUrl: ''
          scopes:
            admin: administrative operations
      description: ''
    BearerAuth:
      type: http
      scheme: bearer
