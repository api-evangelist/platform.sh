      additionalProperties: false
    EnvironmentOperationInput_3:
      type: object
      properties:
        service:
          type: string
          title: Application or worker name
          description: The name of the application or worker to run the operation on
        operation:
          type: string
          title: Operation name
          description: The name of the operation
        parameters:
          type: array
          items:
            type: string
          title: Operation parameters
          description: The parameters to run the operation with
      required:
      - service
      - operation
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          tokenUrl: https://auth.api.platform.sh/oauth2/token
          refreshUrl: https://auth.api.platform.sh/oauth2/token
          scopes: {}
          authorizationUrl: https://auth.api.platform.sh/oauth2/authorize
      description: ''
    OAuth2Admin:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.api.platform.sh/oauth2/token
          refreshUrl: ''
          scopes:
            admin: administrative operations
      description: ''
    BearerAuth:
      type: http
      scheme: bearer
