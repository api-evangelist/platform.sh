openapi: 3.2.0
info:
  title: Platform.sh Runtime Operations API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Runtime Operations across 3 of this provider''s published API definitions: platform.sh-developer-portal-openapi-original.json, platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
tags:
- name: Runtime Operations
paths:
  /projects/{projectId}/environments/{environmentId}/deployments/{deploymentId}/operations:
    post:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      - in: path
        required: true
        schema:
          type: string
        name: environmentId
      - in: path
        required: true
        schema:
          type: string
        name: deploymentId
      operationId: run-operation
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentOperationInput'
      tags:
      - Runtime Operations
      summary: Execute a runtime operation
      description: Execute a runtime operation on a currently deployed environment. This allows you to run one-off commands, such as rebuilding static assets on demand, by defining an `operations` key in a project's `.upsun/config.yaml` configuration. More information on runtime operations is [available in our user documentation](https://docs.upsun.com/anchors/app/runtime-operations/).
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  schemas:
    AcceptedResponse:
      type: object
      properties:
        status:
          type: string
          title: Status text
          description: The status text of the response
        code:
          type: integer
          title: Status code
          description: The status code of the response
      required:
      - status
      - code
      additionalProperties: false
    EnvironmentOperationInput:
      type: object
      properties:
        service:
          type: string
          title: Application or worker name
          description: The name of the application or worker to run the operation on
        operation:
          type: string
          title: Operation name
          description: The name of the operation
        parameters:
          type: array
          items:
            type: string
          title: Operation parameters
          description: The parameters to run the operation with
      required:
      - service
      - operation
      - parameters
      additionalProperties: false
    EnvironmentOperationInput_2:
      type: object
      properties:
        service:
          type: string
          title: Application or worker name
          description: The name of the application or worker to run the operation on
        operation:
          type: string
          title: Operation name
          description: The name of the operation
        parameters:
          type: array
