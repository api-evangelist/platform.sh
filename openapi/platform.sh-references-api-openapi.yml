        status:
          $ref: '#/components/schemas/ProjectStatus'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
    ProjectPlan:
      type: string
      description: The project plan.
    ProjectStatus:
      type: string
      description: The status of the project.
      enum:
      - requested
      - active
      - failed
      - suspended
      - deleted
    RegionCompliance:
      type: object
      description: Information about the region's compliance.
    TeamReference:
      description: The referenced team, or null if it no longer exists.
      type: object
      properties:
        id:
          type: string
          format: ulid
          description: The ID of the team.
        organization_id:
          type: string
          format: ulid
          description: The ID of the parent organization.
        label:
          type: string
          description: The human-readable label of the team.
        project_permissions:
          type: array
          description: Project permissions that are granted to the team.
          items:
            type: string
            enum:
            - admin
            - viewer
            - development:admin
            - development:contributor
            - development:viewer
            - staging:admin
            - staging:contributor
            - staging:viewer
            - production:admin
            - production:contributor
            - production:viewer
        counts:
          type: object
          properties:
            member_count:
              type: integer
              description: Total count of members of the team.
            project_count:
              type: integer
              description: Total count of projects that the team has access to.
        created_at:
          type: string
          format: date-time
          description: The date and time when the team was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time when the team was last updated.
