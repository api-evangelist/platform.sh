openapi: 3.2.0
info:
  title: Platform.sh Grants API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Grants across 3 of this provider''s published API definitions: platform.sh-developer-portal-openapi-original.json, platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
tags:
- name: Grants
paths:
  /users/{user_id}/extended-access:
    get:
      summary: List extended access of a user
      description: List extended access of the given user, which includes both individual and team access to project and organization.
      operationId: list-user-extended-access
      tags:
      - Grants
      parameters:
      - $ref: '#/components/parameters/UserID'
      - in: query
        name: filter[resource_type]
        description: Allows filtering by `resource_type` (project or organization) using one or more operators.
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/StringFilter'
      - in: query
        name: filter[organization_id]
        description: Allows filtering by `organization_id` using one or more operators.
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/StringFilter'
      - in: query
        name: filter[permissions]
        description: Allows filtering by `permissions` using one or more operators.
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/StringFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      x-examples:
                        example-1:
                          user_id: ff9c8376-0227-4928-9b52-b08bc5426689
                          resource_id: an3sjsfwfbgkm
                          resource_type: project
                          organization_id: 01H2X80DMRDZWR6CX753YQHTND
                          granted_at: '2022-04-01T10:11:30.783289Z'
                          updated_at: '2022-04-03T22:12:59.937864Z'
                          permissions:
                          - viewer
                          - staging:contributor
                      properties:
                        user_id:
                          type: string
                          format: uuid
                          description: The ID of the user.
                        resource_id:
                          type: string
                          description: The ID of the resource.
                        resource_type:
                          type: string
                          description: The type of the resource access to which is granted.
                          enum:
                          - project
                          - organization
                        organization_id:
                          type: string
                          description: The ID of the organization owning the resource.
                        permissions:
                          type: array
                          description: List of project permissions.
                          items:
                            type: string
                        granted_at:
                          type: string
                          format: date-time
                          description: The date and time when the access was granted.
                        updated_at:
                          type: string
                          format: date-time
                          description: The date and time when the access was updated.
                  _links:
                    $ref: '#/components/schemas/ListLinks'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /access/{access_id}:
    get:
      summary: Get access document by access ID
      description: Returns the full access document referenced by token claim `access_id`.
      operationId: get-access-document
      tags:
      - Grants
      parameters:
      - in: path
        name: access_id
        required: true
        description: Access document identifier.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Full access document.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_2'
      security:
      - BearerAuth: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  parameters:
    UserID:
      name: user_id
      in: path
      required: true
      description: The ID of the user.
      schema:
        type: string
        example: d81c8ee2-44b3-429f-b944-a33ad7437690
        format: uuid
  schemas:
    ListLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/Link'
        previous:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
    StringFilter:
      type: object
      properties:
        eq:
          type: string
          description: Equal
        ne:
          type: string
          description: Not equal
        in:
          type: string
          description: In (comma-separated list)
        nin:
          type: string
          description: Not in (comma-separated list)
        between:
          type: string
          description: Between (comma-separated list)
        contains:
          type: string
          description: Contains
        starts:
          type: string
          description: Starts with
        ends:
          type: string
          description: Ends with
    Link:
      type: object
      title: Link
      description: A hypermedia link to the {current, next, previous} set of items.
      properties:
        href:
          type: string
          description: URL of the link
    Error:
      description: ''
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        code:
          type: number
        detail:
          type: object
        title:
          type: string
      title: ''
      x-examples:
        example-1:
          status: Invalid input
          message: This field is required.
          code: 400
          detail:
            field:
            - This field is required.
          title: Bad Request
    Error_2:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
    Error_3:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          tokenUrl: https://auth.api.platform.sh/oauth2/token
          refreshUrl: https://auth.api.platform.sh/oauth2/token
          scopes: {}
          authorizationUrl: https://auth.api.platform.sh/oauth2/authorize
      description: ''
    OAuth2Admin:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.api.platform.sh/oauth2/token
          refreshUrl: ''
          scopes:
            admin: administrative operations
      description: ''
    BearerAuth:
      type: http
      scheme: bearer
