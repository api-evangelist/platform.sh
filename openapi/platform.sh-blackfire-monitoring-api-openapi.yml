openapi: 3.2.0
info:
  title: Platform.sh Blackfire Monitoring API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Blackfire Monitoring across 2 of this provider''s published API definitions: platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
security:
- BearerAuth: []
tags:
- name: Blackfire Monitoring
paths:
  /projects/{projectId}/environments/{environmentId}/observability/server/caches:
    get:
      tags:
      - Blackfire Monitoring
      summary: Get server cache metrics
      description: Returns time-series PHP cache usage ratios (0.0-1.0) for OPcache memory, OPcache interned strings buffer (ISB), APCu memory, realpath cache, and PCRE cache. Includes hit rate ratios (0.0-1.0) for APCu and OPcache. Each data point contains `timestamp` and optional data fields. Fields are omitted for timestamps with no data - this indicates no data was received. Filtered by agent ID and execution contexts (web, cli, etc.).
      operationId: blackfire_php_server_caches
      parameters:
      - name: projectId
        in: path
        description: The unique identifier of the Upsun project
        required: true
        schema:
          type: string
          pattern: '[a-z0-9]+'
          example: abc123def456
      - name: environmentId
        in: path
        description: The environment identifier
        required: true
        schema:
          type: string
          pattern: .+
          example: main
      - name: from
        in: query
        description: Start timestamp for the time range (Unix timestamp in seconds)
        required: true
        schema:
          type: integer
          format: int64
          example: 1704067200
      - name: to
        in: query
        description: End timestamp for the time range (Unix timestamp in seconds)
        required: true
        schema:
          type: integer
          format: int64
          example: 1704153600
      - name: grain
        in: query
        description: Granularity of data points in seconds. Auto-calculated if omitted.
        required: false
        schema:
          type: integer
          example: 10
      - name: contexts[]
        in: query
        description: Filter by execution contexts. Defaults to ["web"] with additive mode when neither contexts nor contexts_mode is specified.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            example: web
            enum:
            - web
            - cli
      - name: contexts_mode
        in: query
        description: Filter mode for contexts parameter. "1" (additive, default) includes only specified contexts. "-1" (subtractive) excludes specified contexts and includes all others. When neither contexts nor contexts_mode is specified, defaults to "1" (additive) with contexts=["web"].
        required: false
        schema:
          type: string
          example: '1'
          default: null
          enum:
          - '1'
          - '-1'
      - name: applications[]
        in: query
        description: Filter by application names
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            example: app-frontend
      - name: applications_mode
        in: query
        description: 'Filter mode for applications parameter. "1" (additive) includes only specified applications. "-1" (subtractive) excludes specified applications and includes all others. When omitted: defaults to "-1" if no applications values are provided; defaults to "1" (additive) if at least one applications value is provided.'
        required: false
        schema:
          type: string
          example: '1'
          enum:
          - '1'
          - '-1'
      - name: instances[]
        in: query
        description: Filter by instance names
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            example: app-frontend.0
      - name: instances_mode
        in: query
        description: 'Filter mode for instances parameter. "1" (additive) includes only specified instances. "-1" (subtractive) excludes specified instances and includes all others. When omitted: defaults to "-1" if no instances values are provided; defaults to "1" (additive) if at least one instances value is provided.'
        required: false
        schema:
          type: string
          example: '1'
          enum:
          - '1'
          - '-1'
      - name: distribution_cost
        in: query
        description: Cost distribution dimension for server load distribution.
        required: false
        schema:
          type: string
          default: null
          enum:
          - wt
          - pmu
      responses:
        '200':
          description: PHP server cache metrics retrieved successfully
          content:
            application/json:
              schema:
                required:
                - _grain
                - _from
                - _to
                - _agent
                - _distribution_cost
                - _project_id
                - _environment_id
                - _branch_machine_name
                - data
                properties:
                  _grain:
                    description: Data granularity in seconds
                    type: integer
                    example: 5
                  _from:
                    description: Query start timestamp
                    type: integer
                    example: 1704067200
                  _to:
                    description: Query end timestamp
                    type: integer
                    example: 1704153600
                  _agent:
                    description: Blackfire Agent UUID
                    type: string
                    format: uuid
                    example: a38f69ca-3b56-4ea6-beac-272b2568164a
                  _project_id:
                    description: Project identifier
                    type: string
                    example: abc123def456
                  _environment_id:
                    description: Environment identifier
                    type: string
                    example: main
                  _branch_machine_name:
                    description: Branch machine name
                    type: string
                    example: main-bvxea6i
                  _contexts:
                    description: Applied context filter values
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      example: web
                  _contexts_mode:
                    description: Context filter mode (additive=include only, subtractive=exclude)
                    type:
                    - string
                    - 'null'
                    enum:
                    - additive
                    - subtractive
                  _applications:
                    description: Applied application filter values
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      example: app-frontend
                  _applications_mode:
                    description: Application filter mode (additive=include only, subtractive=exclude)
                    type:
                    - string
                    - 'null'
                    enum:
                    - additive
                    - subtractive
                  _instances:
                    description: Applied instance filter values
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      example: app-frontend.0
                  _instances_mode:
                    description: Instance filter mode (additive=include only, subtractive=exclude)
                    type:
                    - string
                    - 'null'
                    enum:
                    - additive
                    - subtractive
                  _distribution_cost:
                    description: Applied distribution cost dimension (wt=wall time, pmu=peak memory usage)
                    type: string
                    enum:
                    - wt
                    - pmu
                  data:
                    description: Time-series cache usage metrics. Each data point contains `timestamp` and optional data fields. Fields are omitted for timestamps with no data - this indicates no data was received.
                    type: array
                    items:
                      required:
                      - timestamp
                      properties:
                        timestamp:
                          description: Data point timestamp (Unix timestamp in seconds)
                          type: integer
                          example: 1764083014
                        opcache_usage:
                          description: OPcache memory usage ratio (0.0-1.0, where 1.0 = 100% full)
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 0.308
                        opcache_isb_usage:
                          description: OPcache interned strings buffer usage ratio (0.0-1.0)
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 0.629
                        apcu_usage:
                          description: APCu memory usage ratio (0.0-1.0)
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 0.008
                        realpath_usage:
                          description: Realpath cache usage ratio (0.0-1.0)
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 0.109
                        pcre_usage:
                          description: PCRE (Perl Compatible Regular Expressions) cache usage ratio (0.0-1.0)
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 0.304
                        apcu_hitrate:
                          description: APCu cache hit rate ratio (0.0-1.0, where 1.0 = 100% hits)
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 0.999
                        opcache_hitrate:
                          description: OPcache hit rate ratio (0.0-1.0, where 1.0 = 100% hits)
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 0.9998
                      type: object
                      additionalProperties: false
                type: object
                additionalProperties: false
              example:
                _grain: 2
                _from: 1764083002
                _to: 1764083092
                _agent: 4b5266a2-fd71-468b-bf05-87b342079cbf
                _project_id: abc123def456
                _environment_id: main
                _branch_machine_name: main-bvxea6i
                _contexts:
                - web
                _contexts_mode: additive
                _distribution_cost: wt
                data:
                - timestamp: 1764083002
                - timestamp: 1764083014
                  opcache_usage: 0.308
                  opcache_isb_usage: 0.629
                  apcu_usage: 0.008
                  realpath_usage: 0.109
                  pcre_usage: 0.304
                  apcu_hitrate: 0.999
                  opcache_hitrate: 0.9998
                - timestamp: 1764083024
                  opcache_usage: 0.308
                  opcache_isb_usage: 0.629
                  apcu_usage: 0.008
                  realpath_usage: 0.105
                  pcre_usage: 0.313
                  apcu_hitrate: 0.999
                  opcache_hitrate: 0.9998
        '400':
          description: Bad request - Invalid parameters. Please consult the API documentation to fix the request parameters.
          content:
            application/json:
              schema:
                required:
                - type
                - title
                - status
                - violations
                properties:
                  type:
                    description: RFC 2616 reference URL identifying the error type
                    type: string
                    format: uri
                    example: https://tools.ietf.org/html/rfc2616#section-1
                  title:
                    description: Human-readable summary of the validation error
                    type: string
                    example: Please ensure parameters are correct.
                  status:
                    description: HTTP status code
                    type: integer
                    example: 400
                  violations:
                    description: Map of parameter names to their validation errors. Each parameter can have multiple error messages.
                    type: object
                    example:
                      grain:
                      - Grain can not be larger than the selection windows.
                      from:
                      - The from timestamp must be in the past.
                      to:
                      - The to timestamp must be greater than the from timestamp.
                    additionalProperties:
                      type: array
                      items:
                        type: string
                        example: The from timestamp must be in the past.
                type: object
                additionalProperties: false
        '403':
          description: Forbidden - Access denied due to insufficient permissions, or the requested project/environment does not exist (to prevent information disclosure)
        '499':
          description: Too much data fetched - The query is attempting to retrieve too much data. Please narrow down the query by reducing the time range or adding more specific filters to retrieve less data.
          content:
            application/json:
              schema:
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    example: Too much data fetched
                  message:
                    type: string
                    example: Please reduce the time range or add more filters to narrow down the query
                type: object
                additionalProperties: false
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /projects/{projectId}/environments/{environmentId}/observability/server:
    get:
      tags:
      - Blackfire Monitoring
      summary: Get server monitoring overview
      description: Returns time-series server monitoring data for the specified metrics (wall time, memory usage, peak memory usage, CPU load, stdout, requests per minute). Includes alert evaluations and APM quota usage. Data points contain metric values aggregated at the requested granularity.
      operationId: blackfire_server_global
      parameters:
      - name: projectId
        in: path
        description: The unique identifier of the Upsun project
        required: true
        schema:
          type: string
          pattern: '[a-z0-9]+'
          example: abc123def456
      - name: environmentId
        in: path
        description: The environment identifier
        required: true
        schema:
          type: string
          pattern: .+
          example: main
      - name: from
        in: query
        description: Start timestamp for the time range (Unix timestamp in seconds)
        required: true
        schema:
          type: integer
          format: int64
          example: 1704067200
      - name: to
        in: query
        description: End timestamp for the time range (Unix timestamp in seconds)
        required: true
        schema:
          type: integer
          format: int64
          example: 1704153600
      - name: keys[]
        in: query
        description: Metrics to retrieve (wall time, memory usage, peak memory, CPU load, stdout, requests per minute)
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - wt
            - mu
            - pmu
            - load
            - stdout
            - rpms
      - name: grain
        in: query
        description: Granularity of data points in seconds. Auto-calculated if omitted.
        required: false
        schema:
          type: integer
          example: 10
      - name: contexts[]
        in: query
        description: Filter by execution contexts. Defaults to ["web"] with additive mode when neither contexts nor contexts_mode is specified.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            example: web
            enum:
            - web
            - cli
      - name: contexts_mode
        in: query
        description: Filter mode for contexts parameter. "1" (additive, default) includes only specified contexts. "-1" (subtractive) excludes specified contexts and includes all others. When neither contexts nor contexts_mode is specified, defaults to "1" (additive) with contexts=["web"].
        required: false
        schema:
          type: string
          example: '1'
          default: null
          enum:
          - '1'
          - '-1'
      - name: applications[]
        in: query
        description: Filter by application names
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            example: app-frontend
      - name: applications_mode
        in: query
        description: 'Filter mode for applications parameter. "1" (additive) includes only specified applications. "-1" (subtractive) excludes specified applications and includes all others. When omitted: defaults to "-1" if no applications values are provided; defaults to "1" (additive) if at least one applications value is provided.'
        required: false
        schema:
          type: string
          example: '1'
          enum:
          - '1'
          - '-1'
      - name: instances[]
        in: query
        description: Filter by instance names
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            example: app-frontend.0
      - name: instances_mode
        in: query
        description: 'Filter mode for instances parameter. "1" (additive) includes only specified instances. "-1" (subtractive) excludes specified instances and includes all others. When omitted: defaults to "-1" if no instances values are provided; defaults to "1" (additive) if at least one instances value is provided.'
        required: false
        schema:
          type: string
          example: '1'
          enum:
          - '1'
          - '-1'
      - name: distribution_cost
        in: query
        description: Cost distribution dimension for server load distribution.
        required: false
        schema:
          type: string
          default: null
          enum:
          - wt
          - pmu
      responses:
        '200':
          description: Server global metrics retrieved successfully
          content:
            application/json:
              schema:
                required:
                - _quota
                - _grain
                - _from
                - _to
                - _keys
                - _agent
                - _contexts
                - _contexts_mode
                - _project_id
                - _environment_id
                - _branch_machine_name
                - alert_evaluations
                - server
                properties:
                  _quota:
                    description: APM quota usage information
                    required:
                    - allowed
                    - used
                    - exceeded
                    - period_started_at
                    - period_ends_at
                    properties:
                      allowed:
                        description: APM quota limit
                        type: integer
                        example: 2147000000
                      used:
                        description: Traces used in current period
                        type: integer
                        example: 103139
                      exceeded:
                        description: Whether quota is exceeded
                        type: boolean
                        example: false
                      period_started_at:
                        description: Billing period start
                        type:
                        - string
                        - 'null'
                        format: date-time
                        example: '2026-02-01T00:00:00+00:00'
                      period_ends_at:
                        description: Billing period end
                        type:
                        - string
                        - 'null'
                        format: date-time
                        example: '2026-03-01T00:00:00+00:00'
                    type: object
                    additionalProperties: false
                  _grain:
                    description: Data granularity in seconds
                    type: integer
                    example: 5
                  _from:
                    description: Query start timestamp
                    type: integer
                    example: 1704067200
                  _to:
                    description: Query end timestamp
                    type: integer
                    example: 1704153600
                  _keys:
                    description: Requested metric keys
                    type: array
                    items:
                      type: string
                      example: wt
                    example:
                    - wt
                    - rpms
                  _agent:
                    description: Blackfire Agent UUID
                    type: string
                    format: uuid
                    example: a38f69ca-3b56-4ea6-beac-272b2568164a
                  _contexts:
                    description: Applied context filter values
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      example: web
                  _contexts_mode:
                    description: Context filter mode (additive=include only, subtractive=exclude)
                    type:
                    - string
                    - 'null'
                    enum:
                    - additive
                    - subtractive
                  _applications:
                    description: Applied application filter values
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      example: app-frontend
                  _applications_mode:
                    description: Application filter mode (additive=include only, subtractive=exclude)
                    type:
                    - string
                    - 'null'
                    enum:
                    - additive
                    - subtractive
                  _instances:
                    description: Applied instance filter values
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      example: app-frontend.0
                  _instances_mode:
                    description: Instance filter mode (additive=include only, subtractive=exclude)
                    type:
                    - string
                    - 'null'
                    enum:
                    - additive
                    - subtractive
                  _distribution_cost:
                    description: Applied distribution cost dimension (wt=wall time, pmu=peak memory usage)
                    type: string
                    enum:
                    - wt
                    - pmu
                  _project_id:
                    description: Project identifier
                    type: string
                    example: abc123def456
                  _environment_id:
                    description: Environment identifier
                    type: string
                    example: main
                  _branch_machine_name:
                    description: Branch machine name
                    type: string
                    example: main-bvxea6i
                  alert_evaluations:
                    description: Alert rule evaluations for the time range
                    type: array
                    items:
                      required:
                      - timestamp
                      - alert_rule_uuid
                      - value
                      - state
                      properties:
                        timestamp:
                          description: Evaluation timestamp
                          type: integer
                          example: 1771435030
                        alert_rule_uuid:
                          description: Alert rule UUID
                          type: string
                          format: uuid
                          example: b534721b-9751-49bf-ad86-e3bf50d6ec39
                        value:
                          description: Evaluated metric value
                          type: number
                          format: float
                          example: 92395.49
                        state:
                          description: Alert state
                          type: string
                          enum:
                          - normal
                          - warn
                          - alarm
                      type: object
                      additionalProperties: false
                  server:
                    description: Server metrics data
                    required:
                    - total
                    - data
                    properties:
                      total:
                        description: Total trace count (float because APM may be sampled)
                        type: number
                        format: float
                        example: 136328
                      data:
                        description: Time-series metric data points. Properties vary based on requested keys.
                        type: array
                        items:
                          required:
                          - timestamp
                          properties:
                            timestamp:
                              description: Data point timestamp (Unix timestamp in seconds)
                              type: integer
                              example: 1771435020
                            wt:
                              description: Wall time in microseconds
                              type:
                              - number
                              - 'null'
                              format: float
                              example: 89698.03
                            mu:
                              description: Memory usage in bytes
                              type:
                              - number
                              - 'null'
                              format: float
                              example: 4521234
                            pmu:
                              description: Peak memory usage in bytes
                              type:
                              - number
                              - 'null'
                              format: float
                              example: 6789012
                            load:
                              description: CPU load
                              type:
                              - number
                              - 'null'
                              format: float
                              example: 0.45
                            stdout:
                              description: Standard output size
                              type:
                              - number
                              - 'null'
                              format: float
                              example: 0
                            rpms:
                              description: Requests per minute
                              type:
                              - number
                              - 'null'
                              format: float
                              example: 672
                          type: object
                          additionalProperties: false
                    type: object
                    additionalProperties: false
                type: object
                additionalProperties: false
              example:
                _quota:
                  allowed: 2147000000
                  used: 103139
                  exceeded: false
                  period_started_at: '2026-02-01T00:00:00+00:00'
                  period_ends_at: '2026-03-01T00:00:00+00:00'
                _grain: 10
                _from: 1771435023
                _to: 1771440423
                _keys:
                - wt
                - rpms
                _agent: a38f69ca-3b56-4ea6-beac-272b2568164a
                _contexts:
                - web
                _contexts_mode: additive
                _project_id: abc123def456
                _environment_id: main
                _branch_machine_name: main-bvxea6i
                alert_evaluations:
                - timestamp: 1771435030
                  alert_rule_uuid: b534721b-9751-49bf-ad86-e3bf50d6ec39
                  value: 92395.49
                  state: normal
                server:
                  total: 136328
                  data:
                  - timestamp: 1771435020
                    rpms: 672
                    wt: 89698.03
                  - timestamp: 1771435030
                    rpms: 1338
                    wt: 82021.59
        '400':
          description: Bad request - Invalid parameters. Please consult the API documentation to fix the request parameters.
          content:
            application/json:
              schema:
                required:
                - type
                - title
                - status
                - violations
                properties:
                  type:
                    description: RFC 2616 reference URL identifying the error type
                    type: string
                    format: uri
                    example: https://tools.ietf.org/html/rfc2616#section-1
                  title:
                    description: Human-readable summary of the validation error
                    type: string
                    example: Please ensure parameters are correct.
                  status:
                    description: HTTP status code
                    type: integer
                    example: 400
                  violations:
                    description: Map of parameter names to their validation errors. Each parameter can have multiple error messages.
                    type: object
                    example:
                      grain:
                      - Grain can not be larger than the selection windows.
                      from:
                      - The from timestamp must be in the past.
                      to:
                      - The to timestamp must be greater than the from timestamp.
                    additionalProperties:
                      type: array
                      items:
                        type: string
                        example: The from timestamp must be in the past.
                type: object
                additionalProperties: false
        '403':
          description: Forbidden - Access denied due to insufficient permissions, or the requested project/environment does not exist (to prevent information disclosure)
        '499':
          description: Too much data fetched - The query is attempting to retrieve too much data. Please narrow down the query by reducing the time range or adding more specific filters to retrieve less data.
          content:
            application/json:
              schema:
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    example: Too much data fetched
                  message:
                    type: string
                    example: Please reduce the time range or add more filters to narrow down the query
                type: object
                additionalProperties: false
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /projects/{projectId}/environments/{environmentId}/observability/server/transactions-break-down:
    get:
      tags:
      - Blackfire Monitoring
      summary: Get server transaction breakdown
      description: Returns transaction breakdown with impact scores, showing how each transaction contributes to overall resource consumption. Includes time-series data for top-hit transactions and aggregated metrics per transaction. Use breakdown_dimension to analyze by wall time (wt), memory (pmu), or stdout. Supports extensive filtering by context, transaction, host, framework, runtime, HTTP method, status code, and more.
      operationId: blackfire_server_transactions_breakdown
      parameters:
      - name: projectId
        in: path
        description: The unique identifier of the Upsun project
        required: true
        schema:
          type: string
          pattern: '[a-z0-9]+'
          example: abc123def456
      - name: environmentId
        in: path
        description: The environment identifier
        required: true
        schema:
          type: string
          pattern: .+
          example: main
      - name: from
        in: query
