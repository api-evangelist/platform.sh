openapi: 3.2.0
info:
  title: Platform.sh Users API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Users across 3 of this provider''s published API definitions: platform.sh-developer-portal-openapi-original.json, platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
tags:
- name: Users
paths:
  /me:
    get:
      tags:
      - Users
      summary: Get current logged-in user info
      description: Retrieve information about the currently logged-in user (the user associated with the access token).
      operationId: get-current-user-deprecated
      responses:
        '200':
          description: The user object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
      deprecated: true
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /me/phone:
    post:
      tags:
      - Users
      summary: Check if phone verification is required
      description: Find out if the current logged in user requires phone verification to create projects.
      operationId: get-current-user-verification-status
      responses:
        '200':
          description: The information pertinent to determine if the account requires phone verification before project creation.
          content:
            application/json:
              schema:
                properties:
                  verify_phone:
                    description: Does this user need to verify their phone number for project creation.
                    type: boolean
                type: object
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /me/verification:
    post:
      tags:
      - Users
      summary: Check if verification is required
      description: Find out if the current logged in user requires verification (phone or staff) to create projects.
      operationId: get-current-user-verification-status-full
      responses:
        '200':
          description: The information pertinent to determine if the account requires any type of verification before project creation.
          content:
            application/json:
              schema:
                properties:
                  state:
                    description: Does this user need verification for project creation.
                    type: boolean
                  type:
                    description: What type of verification is needed (phone or ticket)
                    type: string
                type: object
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /users/me:
    get:
      summary: Get the current user
      description: Retrieves the current user, determined from the used access token.
      operationId: get-current-user
      tags:
      - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /users/email={email}:
    parameters:
    - schema:
        type: string
        format: email
        example: hello@example.com
      name: email
      in: path
      required: true
      description: The user's email address.
    get:
      summary: Get a user by email
      description: Retrieves a user matching the specified email address.
      operationId: get-user-by-email-address
      tags:
      - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /users/username={username}:
    parameters:
    - schema:
        type: string
        example: platform-sh
      name: username
      in: path
      required: true
      description: The user's username.
    get:
      summary: Get a user by username
      description: Retrieves a user matching the specified username.
      operationId: get-user-by-username
      tags:
      - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /users/{user_id}:
    parameters:
    - $ref: '#/components/parameters/UserID'
    get:
      summary: Get a user
      description: Retrieves the specified user.
      operationId: get-user
      tags:
      - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
      security:
      - OAuth2: []
    patch:
      summary: Update a user
      description: Updates the specified user.
      operationId: update-user
      tags:
      - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                username:
                  type: string
                  description: The user's username.
                first_name:
                  type: string
                  description: The user's first name.
                last_name:
                  type: string
                  description: The user's last name.
                picture:
                  type: string
                  format: uri
                  description: The user's picture.
                company:
                  type: string
                  description: The user's company.
                website:
                  type: string
                  format: uri
                  description: The user's website.
                country:
                  type: string
                  maxLength: 2
                  minLength: 2
                  description: The user's country (2-letter country code).
              x-examples:
                example-1:
                  company: Platform.sh SAS
                  country: EU
                  first_name: Hello
                  last_name: World
                  picture: https://accounts.platform.sh/profiles/blimp_profile/themes/platformsh_theme/images/mail/logo.png
                  username: username
                  website: https://platform.sh
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /users/{user_id}/emailaddress:
    parameters:
    - $ref: '#/components/parameters/UserID'
    post:
      summary: Reset email address
      description: Requests a reset of the user's email address. A confirmation email will be sent to the new address when the request is accepted.
      operationId: reset-email-address
      tags:
      - Users
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email_address:
                  type: string
                  format: email
              required:
              - email_address
        description: ''
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /users/{user_id}/resetpassword:
    parameters:
    - $ref: '#/components/parameters/UserID'
    post:
      summary: Reset user password
      description: Requests a reset of the user's password. A password reset email will be sent to the user when the request is accepted.
      operationId: reset-password
      tags:
      - Users
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  schemas:
    CurrentUser:
      description: The user object.
      properties:
        id:
