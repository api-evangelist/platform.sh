openapi: 3.2.0
info:
  title: Platform.sh Deployment Target API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Deployment Target across 3 of this provider''s published API definitions: platform.sh-developer-portal-openapi-original.json, platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
tags:
- name: Deployment Target
  description: 'Upsun is capable of deploying the production environments of

    projects in multiple topologies: both in clusters of containers, and

    as dedicated virtual machines. This is an internal API that can

    only be used by privileged users.

    '
paths:
  /projects/{projectId}/deployments:
    get:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      operationId: list-projects-deployments
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentTargetCollection'
      tags:
      - Deployment Target
      summary: Get project deployment target info
      description: 'The deployment target information for the project.

        '
      security:
      - OAuth2: []
    post:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      operationId: create-projects-deployments
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentTargetCreateInput'
      tags:
      - Deployment Target
      summary: Create a project deployment target
      description: 'Set the deployment target information for a project.

        '
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /projects/{projectId}/deployments/{deploymentTargetConfigurationId}:
    get:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      - in: path
        required: true
        schema:
          type: string
        name: deploymentTargetConfigurationId
      operationId: get-projects-deployments
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentTarget'
      tags:
      - Deployment Target
      summary: Get a single project deployment target
      description: 'Get a single deployment target configuration of a project.

        '
      security:
      - OAuth2: []
    patch:
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentTargetPatch'
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      - in: path
        required: true
        schema:
          type: string
        name: deploymentTargetConfigurationId
      operationId: update-projects-deployments
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
      tags:
      - Deployment Target
      summary: Update a project deployment
      security:
      - OAuth2: []
    delete:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      - in: path
        required: true
        schema:
          type: string
        name: deploymentTargetConfigurationId
      operationId: delete-projects-deployments
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
      tags:
      - Deployment Target
      summary: Delete a single project deployment target
      description: 'Delete a single deployment target configuration associated with a specific project.

        '
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  schemas:
    FoundationDeploymentTargetCreateInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - dedicated
          - enterprise
          - local
          title: Deployment target type
          description: The type of the deployment target.
        name:
          type: string
          title: Deployment target name
          description: The name of the deployment target.
        hosts:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              id:
                type:
                - string
                - 'null'
                title: Host identifier
                description: The identifier of the host.
              type:
                type: string
                enum:
                - core
                - satellite
                title: Deployment type
                description: The type of the deployment to this host.
              services:
                type:
                - array
                - 'null'
                items:
                  type: string
                title: Assigned services
                description: The services assigned to this host
            required:
            - id
            - type
            additionalProperties: false
          title: Deployment hosts
          description: The hosts of the deployment target.
        use_dedicated_grid:
          type: boolean
          title: Whether the deployment should target dedicated Grid hosts.
          description: 'When true, the deployment will be pinned to Grid hosts dedicated to the environment using this deployment target.


            Dedicated Grid hosts must be created prior to deploying the environment.


            The constraints that will be set are as follows:


            * `cluster_type` is set to `environment-custom`.

            * `cluster` is set to the environment''s cluster name.'
      required:
      - type
      - name
      additionalProperties: false
    EnterpriseDeploymentTargetPatch:
      type: object
      properties:
        type:
          type: string
          enum:
          - dedicated
          - enterprise
          - local
          title: Deployment target type
          description: The type of the deployment target.
        name:
          type: string
          title: Deployment target name
          description: The name of the deployment target.
        site_urls:
          type: object
          title: Site URLs
          description: ''
        ssh_hosts:
          type: array
          items:
            type: string
          title: SSH Hosts
          description: List of SSH Hosts.
        enterprise_environments_mapping:
          type: object
          title: Enterprise Environments Mapping
          description: Mapping of clusters to Enterprise applications
          deprecated: true
          x-stability: DEPRECATED
      required:
      - type
      - name
      additionalProperties: false
