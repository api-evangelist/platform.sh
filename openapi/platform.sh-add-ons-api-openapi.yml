openapi: 3.2.0
info:
  title: Platform.sh Add Ons API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Add-ons across 3 of this provider''s published API definitions: platform.sh-developer-portal-openapi-original.json, platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
tags:
- name: Add-ons
paths:
  /organizations/{organization_id}/addons:
    get:
      summary: Get add-ons
      description: Retrieves information about the add-ons for an organization.
      operationId: get-org-addons
      tags:
      - Add-ons
      parameters:
      - $ref: '#/components/parameters/OrganizationIDName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAddonsObject'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      x-vendor: upsun
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  schemas:
    OrganizationAddonsObject:
      type: object
      description: The list of available and current add-ons of an organization.
      properties:
        available:
          type: object
          description: The list of available add-ons and their possible values.
          properties:
            user_management:
              type: object
              description: Information about the levels of user management that are available.
              additionalProperties:
                type: number
                description: The number of commitment days required for the addon.
            support_level:
              type: object
              description: Information about the levels of support available.
              additionalProperties:
                type: number
                description: The number of commitment days required for the addon.
        current:
          type: object
          description: The list of existing add-ons and their current values.
          properties:
            user_management:
              type: object
              description: Information about the type of user management currently selected.
              additionalProperties:
                type: number
                description: The number of commitment days that remain for the addon.
            support_level:
              type: object
              description: Information about the level of support currently selected.
              additionalProperties:
                type: number
                description: The number of commitment days that remain for the addon.
        upgrades_available:
          type: object
          description: The upgrades available for current add-ons.
          properties:
            user_management:
              type: array
              description: Available upgrade options for user management.
              items:
                type: string
            support_level:
              type: array
              description: Available upgrade options for support.
              items:
                type: string
    Error:
      description: ''
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        code:
          type: number
        detail:
          type: object
        title:
          type: string
      title: ''
      x-examples:
        example-1:
          status: Invalid input
          message: This field is required.
          code: 400
          detail:
            field:
            - This field is required.
          title: Bad Request
    Error_2:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
    Error_3:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
  parameters:
    OrganizationIDName:
      in: path
      name: organization_id
      description: 'The ID of the organization.<br>

        Prefix with name= to retrieve the organization by name instead.

        '
      required: true
      schema:
        type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          tokenUrl: https://auth.api.platform.sh/oauth2/token
          refreshUrl: https://auth.api.platform.sh/oauth2/token
          scopes: {}
          authorizationUrl: https://auth.api.platform.sh/oauth2/authorize
      description: ''
    OAuth2Admin:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.api.platform.sh/oauth2/token
          refreshUrl: ''
          scopes:
            admin: administrative operations
      description: ''
    BearerAuth:
      type: http
      scheme: bearer
