openapi: 3.2.0
info:
  title: Platform.sh Organization Projects API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Organization Projects across 3 of this provider''s published API definitions: platform.sh-developer-portal-openapi-original.json, platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
tags:
- name: Organization Projects
paths:
  /organizations/{organization_id}/projects:
    get:
      summary: List projects
      description: Retrieves a list of projects for the specified organization.
      operationId: list-org-projects
      tags:
      - Organization Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - in: query
        name: filter[id]
        description: Allows filtering by `id` using one or more operators.
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/StringFilter'
      - in: query
        name: filter[title]
        description: Allows filtering by `title` using one or more operators.
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/StringFilter'
      - in: query
        name: filter[status]
        description: Allows filtering by `status` using one or more operators.
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/StringFilter'
      - in: query
        name: filter[updated_at]
        description: Allows filtering by `updated_at` using one or more operators.
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/DateTimeFilter'
      - in: query
        name: filter[created_at]
        description: Allows filtering by `created_at` using one or more operators.
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/DateTimeFilter'
      - in: query
        name: page[size]
        description: Determines the number of items to show.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: null
      - in: query
        name: page[before]
        description: Pagination cursor. This is automatically generated as necessary and provided in HAL links (_links); it should not be constructed externally.
        schema:
          type: string
      - in: query
        name: page[after]
        description: Pagination cursor. This is automatically generated as necessary and provided in HAL links (_links); it should not be constructed externally.
        schema:
          type: string
      - in: query
        name: sort
        description: 'Allows sorting by a single field.<br>

          Use a dash ("-") to sort descending.<br>

          Supported fields: `id`, `region`, `title`, `type`, `plan`, `status`, `created_at`, `updated_at`.

          '
        schema:
          type: string
          example: -updated_at
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationProject'
                  _links:
                    $ref: '#/components/schemas/ListLinks'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    post:
      summary: Create project
      description: Creates a new project in the specified organization.
      operationId: create-org-project
      tags:
      - Organization Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - region
              properties:
                organization_id:
                  $ref: '#/components/schemas/OrganizationID'
                region:
                  $ref: '#/components/schemas/RegionID'
                title:
                  $ref: '#/components/schemas/ProjectTitle'
                type:
                  $ref: '#/components/schemas/ProjectType'
                plan:
                  $ref: '#/components/schemas/ProjectPlan'
                default_branch:
                  $ref: '#/components/schemas/ProjectDefaultBranch'
                cse_notes:
                  $ref: '#/components/schemas/ProjectCSENotes'
                dedicated_tag:
                  $ref: '#/components/schemas/ProjectDedicatedTag'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProject'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /organizations/{organization_id}/projects/{project_id}:
    get:
      summary: Get project
      description: Retrieves the specified project.
      operationId: get-org-project
      tags:
      - Organization Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProject'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    patch:
      summary: Update project
      description: Updates the specified project.
      operationId: update-org-project
      tags:
      - Organization Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: '#/components/schemas/ProjectTitle'
                plan:
                  $ref: '#/components/schemas/ProjectPlan'
                timezone:
                  $ref: '#/components/schemas/ProjectTimeZone'
                cse_notes:
                  $ref: '#/components/schemas/ProjectCSENotes'
                dedicated_tag:
                  $ref: '#/components/schemas/ProjectDedicatedTag'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProject'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    delete:
      summary: Delete project
      description: Deletes the specified project.
      operationId: delete-org-project
      tags:
      - Organization Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /organizations/{organization_id}/projects/{project_id}/metrics/carbon:
    get:
      summary: Query project carbon emissions metrics
      description: Queries the carbon emission data for the specified project using the supplied parameters.
      operationId: query-project-carbon
      tags:
      - Organization Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/interval'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCarbon'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
  /organizations/{organization_id}/projects/provisioning:
    get:
      summary: Stream provisioning progress
      description: 'Streams real-time provisioning progress for projects being created in the

        specified organization. The response is an NDJSON stream where each line

        is a JSON object representing a provisioning event.


        The stream emits events as provisioning stages complete and terminates

        automatically when all in-flight projects finish (or fail). A keep-alive

        event is sent periodically to prevent connection timeouts.


        The body is a newline-delimited stream of JSON objects.

        Each line is a single `ProvisionEvent`.


        The `data`, `done`, and `error` events include a `steps` array listing the ordered provisioning steps.


        Event types:

        - `data` — a provisioning stage completed

        - `done` — provisioning finished successfully

        - `error` — provisioning failed

        - `keep_alive` — connection keep-alive

        '
      operationId: stream-org-project-provisioning
      tags:
      - Organization Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: OK
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/ProvisionEvent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - BearerAuth: []
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  schemas:
    ProjectTimeZone:
      type: string
      description: Timezone of the project.
    ProjectTrialPlan:
      description: Whether the project is currently on a trial plan.
      type: boolean
    MetricsValues:
      type: array
      items:
        $ref: '#/components/schemas/MetricsValue'
    ProjectID:
      type: string
      description: The ID of the project.
    CreatedAt:
      type: string
      format: date-time
      description: The date and time when the resource was created.
    MetricsMetadata:
      type: object
      properties:
        from:
          description: The value used to calculate the lower bound of the temporal query. Inclusive.
        to:
          description: The truncated value used to calculate the upper bound of the temporal query. Exclusive.
        interval:
          description: The interval used to group the metric values.
        units:
          description: The units associated with the provided values.
    MetricsValue:
      type: object
      properties:
        value:
          description: The measured value of the metric for the given time interval.
        start_time:
          description: The timestamp at which the time interval began.
    ProjectType:
      type: string
      description: The type of projects.
      enum:
      - grid
      - dedicated
    CarbonTotal:
      type: number
      description: The calculated total of the metric for the given interval.
    ListLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/Link'
        previous:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
    ProjectCSENotes:
      type: string
      description: CSE notes.
    ProjectDedicatedTag:
      type: string
      description: Dedicated tag.
    ProjectCarbon:
      type: object
      properties:
        project_id:
          $ref: '#/components/schemas/ProjectID'
        project_title:
          $ref: '#/components/schemas/ProjectTitle'
        meta:
          $ref: '#/components/schemas/MetricsMetadata'
        values:
          $ref: '#/components/schemas/MetricsValues'
        total:
          $ref: '#/components/schemas/CarbonTotal'
    Error:
      description: ''
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        code:
          type: number
        detail:
          type: object
        title:
          type: string
      title: ''
      x-examples:
        example-1:
          status: Invalid input
          message: This field is required.
          code: 400
          detail:
            field:
            - This field is required.
          title: Bad Request
    RegionID:
      type: string
      description: The machine name of the region where the project is located.
    ProjectPlan:
      type: string
      description: The project plan.
    ProjectStatus:
      type: string
      description: The status of the project.
      enum:
      - requested
      - active
      - failed
      - suspended
      - deleted
    OrganizationProject:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ProjectID'
        organization_id:
          $ref: '#/components/schemas/OrganizationID'
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        vendor:
          type: string
          description: Vendor of the project.
        region:
          $ref: '#/components/schemas/RegionID'
        title:
          $ref: '#/components/schemas/ProjectTitle'
        type:
          $ref: '#/components/schemas/ProjectType'
        plan:
          $ref: '#/components/schemas/ProjectPlan'
        timezone:
          $ref: '#/components/schemas/ProjectTimeZone'
        default_branch:
          $ref: '#/components/schemas/ProjectDefaultBranch'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        trial_plan:
          $ref: '#/components/schemas/ProjectTrialPlan'
        project_ui:
          $ref: '#/components/schemas/ProjectUI'
        locked:
          $ref: '#/components/schemas/ProjectLocked'
        cse_notes:
          $ref: '#/components/schemas/ProjectCSENotes'
        dedicated_tag:
          $ref: '#/components/schemas/ProjectDedicatedTag'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        _links:
          type: object
          properties:
            self:
              type: object
              description: Link to the current project.
              properties:
                href:
                  type: string
                  description: URL of the link.
            update:
              type: object
              description: Link for updating the current project.
              properties:
                href:
                  type: string
                  description: URL of the link.
                method:
                  type: string
                  description: The HTTP method to use.
            delete:
              type: object
              description: Link for deleting the current project.
              properties:
                href:
                  type: string
                  description: URL of the link.
                method:
                  type: string
                  description: The HTTP method to use.
            activities:
              type: object
              description: Link to the project's activities.
              properties:
                href:
                  type: string
                  description: URL of the link.
            addons:
              type: object
              description: Link to the project's add-ons.
              properties:
                href:
                  type: string
                  description: URL of the link.
    DateTimeFilter:
      type: object
      properties:
        eq:
          type: string
          description: Equal
        ne:
          type: string
          description: Not equal
        between:
          type: string
          description: Between (comma-separated list)
        gt:
          type: string
          description: Greater than
        gte:
          type: string
          description: Greater than or equal
        lt:
          type: string
          description: Less than
        lte:
          type: string
          description: Less than or equal
    Link:
      type: object
      title: Link
      description: A hypermedia link to the {current, next, previous} set of items.
      properties:
        href:
          type: string
          description: URL of the link
    ProjectLocked:
      type: boolean
      description: Locked
    ProjectDefaultBranch:
      type: string
      description: Default branch.
    OrganizationID:
      type: string
      description: The ID of the organization.
    SubscriptionID:
      type: string
      description: The ID of the subscription.
    StringFilter:
      type: object
      properties:
        eq:
          type: string
          description: Equal
        ne:
          type: string
          description: Not equal
        in:
          type: string
          description: In (comma-separated list)
        nin:
          type: string
          description: Not in (comma-separated list)
        between:
          type: string
          description: Between (comma-separated list)
        contains:
          type: string
          description: Contains
        starts:
          type: string
          description: Starts with
        ends:
          type: string
          description: Ends with
    UpdatedAt:
      type: string
      format: date-time
      description: The date and time when the resource was last updated.
    ProjectTitle:
      type: string
      description: The title of the project.
    ProjectUI:
      description: The URL for the project's user interface.
      type: string
    AggregatedSellables:
      type: object
      description: Map of sellable names to their configuration.
      additionalProperties:
        type: object
        description: Sellable product configuration.
    PlanTitles:
      type: object
      description: Map of plan IDs to their human-readable titles.
      additionalProperties:
        type: string
    ProvisionEvent:
      type: object
      description: A single event in the provisioning progress stream.
      required:
      - type
      properties:
        type:
          type: string
          description: The event type.
          enum:
          - data
          - done
          - error
          - keep_alive
        project_id:
          type: string
          description: The ID of the project being provisioned.
        stage:
          type: string
          description: The current provisioning stage.
        label:
          type: string
          description: A human-readable label for the current stage.
        reason:
          type: string
          description: The reason for failure (only present on error events).
        timestamp:
          type: string
          format: date-time
          description: The time the event was emitted.
        steps:
          type: array
          description: Ordered list of provisioning steps.
          items:
            $ref: '#/components/schemas/ProvisionStep'
      additionalProperties: false
    MetricsMetadata_2:
      type: object
      properties:
        from:
          description: The value used to calculate the lower bound of the temporal query. Inclusive.
        to:
          description: The truncated value used to calculate the upper bound of the temporal query. Exclusive.
        interval:
          description: The interval used to group the metric values.
        units:
          description: The units associated with the provided values.
      additionalProperties: false
    AggregatedFeatures:
      type: object
      properties:
        backups:
          type:
          - object
          - 'null'
          description: Backup features configuration.
    MetricsValue_2:
      type: object
      properties:
        value:
          description: The measured value of the metric for the given time interval.
        start_time:
          description: The timestamp at which the time interval began.
      additionalProperties: false
    ProjectFacets:
      type: object
      description: Facets for filtering options.
      properties:
        plans:
          type:
          - object
          - 'null'
          description: Map of plan IDs to plan names.
          additionalProperties:
            type: string
      additionalProperties: false
    Error_2:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
    ProjectCarbon_2:
      type: object
      properties:
        project_id:
          $ref: '#/components/schemas/ProjectID'
        project_title:
          $ref: '#/components/schemas/ProjectTitle'
        meta:
          $ref: '#/components/schemas/MetricsMetadata_2'
        values:
          $ref: '#/components/schemas/MetricsValues'
        total:
          $ref: '#/components/schemas/CarbonTotal'
      additionalProperties: false
    Activity:
      type: object
      properties:
        id:
          type: string
          title: Activity Identifier
          description: The identifier of Activity
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          title: Creation date
          description: The creation date
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          title: Update date
          description: The update date
        type:
          type: string
          title: Type
          description: The type of the activity
        parameters:
          type: object
          title: Parameters
          description: The parameters of the activity
        project:
          type: string
          title: Project
          description: The project the activity belongs to
        integration:
          type: string
          title: Integration
          description: The integration the activity belongs to
        environments:
          type: array
          items:
            type: string
          title: Environments
          description: The environments related to the activity
        state:
          type: string
          enum:
          - cancelled
          - complete
          - in_progress
          - pending
          - scheduled
          - staged
          title: State
          description: The state of the activity
        result:
          type:
          - string
          - 'null'
          enum:
          - failure
          - success
          title: Result
          description: The result of the activity
        failure_reason:
          type:
          - string
          - 'null'
          enum:
          - error
          - shell
          title: Failure Reason
          description: The reason for activity failure
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          title: Start date
          description: The start date of the activity
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          title: Completion date
          description: The completion date of the activity
        completion_percent:
          type: integer
          title: Completion percentage
          description: The completion percentage of the activity
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
          title: Cancellation date
          description: The Cancellation date of the activity
        timings:
          type: object
          additionalProperties:
            type: number
            format: float
          title: Timings
          description: Timings related to different phases of the activity
        log:
          type: string
          title: Log
          description: The log of the activity
          deprecated: true
          x-stability: DEPRECATED
        payload:
          type: object
          title: Payload
          description: The payload of the activity
        description:
          type:
          - string
          - 'null'
          title: Activity HTML description
          description: The description of the activity, formatted with HTML
        text:
          type:
          - string
          - 'null'
          title: Activity text description
          description: The description of the activity, formatted as plain text
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          title: Expiration date
          description: The date at which the activity will expire
        commands:
          type: array
          items:
            type: object
            properties:
              app:
                type: string
                title: Application
                description: ''
              type:
                type: string
                title: Type
                description: ''
              exit_code:
                type: integer
                title: Exit status code
                description: ''
            required:
            - app
            - type
            - exit_code
            additionalProperties: false
          title: Commands
          description: The commands of the activity
      required:
      - id
      - created_at
      - updated_at
      - type
      - parameters
      - project
      - state
      - result
      - failure_reason
      - started_at
      - completed_at
      - completion_percent
      - cancelled_at
      - timings
      - log
      - payload
      - description
      - text
      - expires_at
      - commands
      additionalProperties: false
    ProvisionStep:
      type: object
      description: A single step in the provisioning plan.
      required:
      - stage
      - label
      properties:
        stage:
          type: string
          description: The step identifier.
        label:
          type: string
          description: A human-readable label for the step.
      additionalProperties: false
    OrganizationProject_2:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ProjectID'
        organization_id:
          $ref: '#/components/schemas/OrganizationID'
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        vendor:
          type: string
          description: Vendor of the project.
        region:
          $ref: '#/components/schemas/RegionID'
        title:
          $ref: '#/components/schemas/ProjectTitle'
        type:
          $ref: '#/components/schemas/ProjectType'
        plan:
          $ref: '#/components/schemas/ProjectPlan'
