          title: Is code or data restored
          description: Whether we should restore the code or only the data
        restore_resources:
          type: boolean
          title: Is resources restored
          description: Whether we should restore resources configuration from the backup
        resources:
          type:
          - object
          - 'null'
          properties:
            init:
