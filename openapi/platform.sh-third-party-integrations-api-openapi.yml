          - prefix
          - structured_data
          title: Authentication mode
          description: ''
        tls_verify:
          type: boolean
          title: TLS Verify
          description: Enable/Disable HTTPS certificate verification
        excluded_services:
          type: array
          items:
            type: string
          title: Excluded Services
          description: Comma separated list of service and application names to exclude from logging
