openapi: 3.2.0
info:
  title: Platform.sh Diff API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Diff across 2 of this provider''s published API definitions: platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
security:
- BearerAuth: []
tags:
- name: Diff
paths:
  /projects/{projectId}/git/diffs/{diffBaseId}/{diffTargetId}:
    get:
      parameters:
      - in: path
        required: true
        schema:
          type: string
        name: projectId
      - in: path
        required: true
        schema:
          type: string
        name: diffBaseId
      - in: path
        required: true
        schema:
          type: string
        name: diffTargetId
      operationId: list-projects-git-diffs
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffCollection'
      tags:
      - Diff
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  schemas:
    DiffCollection:
      type: array
      items:
        $ref: '#/components/schemas/Diff'
    Diff:
      type: object
      properties:
        id:
          type: string
          title: Diff Identifier
          description: The identifier of Diff
        diff:
          type: string
          title: Unified diff
          description: The unified diff between two trees
        new_path:
          type:
          - string
          - 'null'
          title: New Path
          description: The new path of the file in the diff
        new_id:
          type:
          - string
          - 'null'
          title: New ID
          description: The new object ID of the file in the diff
        old_path:
          type:
          - string
          - 'null'
          title: Old Path
          description: The old path of the file in the diff
        old_id:
          type:
          - string
          - 'null'
          title: Old ID
          description: The old object ID of the file in the diff
      required:
      - id
      - diff
      - new_path
      - new_id
      - old_path
      - old_id
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
x-refined-from:
- platform.sh-openapi-original.json
- platform.sh-rest-api-openapi.json
