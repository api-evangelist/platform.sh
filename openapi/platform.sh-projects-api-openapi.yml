openapi: 3.2.0
info:
  title: Platform.sh Projects API
  version: '1.0'
  contact:
    name: Support
    url: https://upsun.com/contact-us/
  termsOfService: https://upsun.com/trust-center/legal/tos/
  x-logo:
    url: https://docs.upsun.com/images/upsun-api.svg
    href: https://upsun.com/#section/Introduction
    altText: Upsun logo
  description: 'Operations tagged Projects across 2 of this provider''s published API definitions: platform.sh-openapi-original.json, platform.sh-rest-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{schemes}://api.upsun.com'
  description: The Upsun.com API gateway
  variables:
    schemes:
      default: https
security:
- BearerAuth: []
tags:
- name: Projects
paths:
  /organizations/{organization_id}/projects/{project_id}/history:
    get:
      summary: List project history
      description: Retrieves history records for the specified project, oldest first.
      operationId: list-org-project-history
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Total number of items returned.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/History'
                  _links:
                    $ref: '#/components/schemas/ListLinks'
                additionalProperties: false
                required:
                - count
                - items
                - _links
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: '{schemes}://api.upsun.com'
      description: The Upsun.com API gateway
      variables:
        schemes:
          default: https
components:
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
    ListLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/Link'
        previous:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
    Link:
      type: object
      title: Link
      description: A hypermedia link to the {current, next, previous} set of items.
      properties:
        href:
          type: string
          description: URL of the link
    History:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the history record.
        project_id:
          type: string
          description: The ID of the project.
        event_type:
          type: string
          description: The type of event that triggered the record.
        event_id:
          type: string
          description: The ID of the event.
        resource:
          type: string
          description: The resource type (e.g., cpu_app, memory_services, storage).
        environment:
          type: string
          description: The environment name.
        quantity:
          type: string
          description: The quantity of the resource.
        timestamp:
          type: string
          format: date-time
          description: The timestamp when the record was created.
        user:
          type: string
          description: The ID of the user who triggered the event.
      additionalProperties: false
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      description: The ID of the project.
      schema:
        type: string
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: The ID of the organization.
      schema:
        type: string
        format: ulid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
x-refined-from:
- platform.sh-openapi-original.json
- platform.sh-rest-api-openapi.json
